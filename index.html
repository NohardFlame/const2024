<!DOCTYPE html>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<meta http-equiv="Expires" content="0" />
<html lang="en">

<head>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.4/p5.js"></script>
  <link rel="stylesheet" type="text/css" href="style.css">
  <meta charset="utf-8" />
</head>

<body>
  <main>
  </main>

  <aside id="nebula-panel" class="nebula-panel" hidden>
    <header class="nebula-panel__header">
      <h2>Настройки доски</h2>
      <button type="button" id="nebula-close" class="nebula-panel__close" aria-label="Close">×</button>
    </header>
    <p class="nebula-panel__hint"><kbd>N</kbd> — только на этом компьютере. Общие дефолты: вход админа → settings.php</p>

    <section class="nebula-panel__section">
      <h3 class="nebula-panel__section-title">Доска / Skyrim</h3>
      <label>
        <span class="nebula-panel__name">Paper</span>
        <input type="color" id="style-paper">
      </label>
      <label>
        <span class="nebula-panel__name">Ink</span>
        <input type="color" id="style-ink">
      </label>
      <label>
        <span class="nebula-panel__name">Gold</span>
        <input type="color" id="style-gold">
      </label>
      <label>
        <span class="nebula-panel__name">Star dim</span>
        <input type="color" id="style-star-dim">
      </label>
      <label>
        <span class="nebula-panel__name">Star lit</span>
        <input type="color" id="style-star-lit">
      </label>
      <label>
        <span class="nebula-panel__name">Star hot</span>
        <input type="color" id="style-star-hot">
      </label>
      <label>
        <span class="nebula-panel__name">Star brightness</span>
        <span id="style-star-brightness-val">1.15</span>
        <input type="range" id="style-star-brightness" min="0.4" max="2.2" step="0.05">
      </label>
      <label>
        <span class="nebula-panel__name">Header size</span>
        <span id="style-header-val">0.18</span>
        <input type="range" id="style-header" min="0.1" max="0.28" step="0.01">
      </label>
      <h3 class="nebula-panel__section-title" style="margin-top:12px">Сетка</h3>
      <label class="nebula-panel__row">
        <span class="nebula-panel__name">Plate</span>
        <input type="color" id="style-class-plate">
      </label>
      <label class="nebula-panel__row">
        <span class="nebula-panel__name">Plate alpha</span>
        <span id="style-class-plate-alpha-val">0.84</span>
        <input type="range" id="style-class-plate-alpha" min="0.2" max="1" step="0.02">
      </label>
      <label class="nebula-panel__row">
        <span class="nebula-panel__name">Glyph</span>
        <input type="color" id="style-class-glyph">
      </label>
      <label class="nebula-panel__row">
        <span class="nebula-panel__name">Hover</span>
        <input type="color" id="style-class-hover">
      </label>
      <label class="nebula-panel__row">
        <span class="nebula-panel__name">Active</span>
        <input type="color" id="style-class-active">
      </label>
      <p class="nebula-panel__hint" style="margin:8px 0 4px">Силуэт на доске (цвет сейчас; width/dash — при экспорте из trace)</p>
      <label class="nebula-panel__row">
        <span class="nebula-panel__name">Silhouette color</span>
        <input type="color" id="style-sil-color">
      </label>
      <label class="nebula-panel__row">
        <span class="nebula-panel__name">Silhouette alpha</span>
        <span id="style-sil-alpha-val">0.58</span>
        <input type="range" id="style-sil-alpha" min="0.1" max="0.85" step="0.02">
      </label>
      <label class="nebula-panel__row">
        <span class="nebula-panel__name">Silhouette width</span>
        <span id="style-sil-width-val">1.2</span>
        <input type="range" id="style-sil-width" min="0.2" max="6" step="0.1">
      </label>
      <label class="nebula-panel__row">
        <span class="nebula-panel__name">Silhouette dash</span>
        <input type="text" id="style-sil-dash" style="width:9em;font:inherit">
      </label>
      <div class="nebula-panel__actions">
        <button type="button" id="style-reset" class="nebula-panel__btn nebula-panel__btn--ghost">Сброс стиля</button>
        <button type="button" id="style-save-defaults" class="nebula-panel__btn">Стиль для всех</button>
      </div>
    </section>

    <h3 class="nebula-panel__section-title">Туманность</h3>

    <section class="nebula-panel__section">
      <label>
        <span class="nebula-panel__name">Color A <span class="nebula-panel__hint-inline">(основной цвет газа)</span></span>
        <input type="color" id="nebula-color-a">
      </label>
      <label>
        <span class="nebula-panel__name">Color B <span class="nebula-panel__hint-inline">(второй цвет по плотности)</span></span>
        <input type="color" id="nebula-color-b">
      </label>
      <label>
        <span class="nebula-panel__name">Color C <span class="nebula-panel__hint-inline">(тёмные «пустоты»)</span></span>
        <input type="color" id="nebula-color-c">
      </label>
      <label>
        <span class="nebula-panel__name">Color D <span class="nebula-panel__hint-inline">(яркие блики)</span></span>
        <input type="color" id="nebula-color-d">
      </label>
    </section>

    <section class="nebula-panel__section">
      <label>
        <span class="nebula-panel__name">Octaves <span class="nebula-panel__hint-inline">(слои шума; 0 = авто)</span></span>
        <span id="nebula-octaves-val">auto</span>
        <input type="range" id="nebula-octaves" min="0" max="6" step="1">
      </label>
      <label>
        <span class="nebula-panel__name">Detail <span class="nebula-panel__hint-inline">(сила мелких слоёв шума)</span></span>
        <span id="nebula-detail-val">1.00</span>
        <input type="range" id="nebula-detail" min="0.3" max="2.5" step="0.05">
      </label>
      <label>
        <span class="nebula-panel__name">Scale <span class="nebula-panel__hint-inline">(размер облаков / зум)</span></span>
        <span id="nebula-scale-val">3.00</span>
        <input type="range" id="nebula-scale" min="0.5" max="8" step="0.1">
      </label>
      <label>
        <span class="nebula-panel__name">Gain <span class="nebula-panel__hint-inline">(сила каждого слоя)</span></span>
        <span id="nebula-gain-val">0.50</span>
        <input type="range" id="nebula-gain" min="0.2" max="0.8" step="0.01">
      </label>
      <label>
        <span class="nebula-panel__name">Lacunarity <span class="nebula-panel__hint-inline">(частота между слоями)</span></span>
        <span id="nebula-lacunarity-val">2.00</span>
        <input type="range" id="nebula-lacunarity" min="1.2" max="3.5" step="0.05">
      </label>
      <label>
        <span class="nebula-panel__name">Warp <span class="nebula-panel__hint-inline">(искривление / завихрения)</span></span>
        <span id="nebula-warp-val">2.00</span>
        <input type="range" id="nebula-warp" min="0" max="4" step="0.05">
      </label>
      <label>
        <span class="nebula-panel__name">Period <span class="nebula-panel__hint-inline">(длина цикла анимации)</span></span>
        <span id="nebula-period-val">48s</span>
        <input type="range" id="nebula-period" min="8" max="120" step="1">
      </label>
      <label>
        <span class="nebula-panel__name">Contrast <span class="nebula-panel__hint-inline">(контраст света и тени)</span></span>
        <span id="nebula-contrast-val">1.00</span>
        <input type="range" id="nebula-contrast" min="0.4" max="2" step="0.05">
      </label>
      <label>
        <span class="nebula-panel__name">Brightness <span class="nebula-panel__hint-inline">(общая яркость фона)</span></span>
        <span id="nebula-brightness-val">1.00</span>
        <input type="range" id="nebula-brightness" min="0.2" max="2" step="0.05">
      </label>
      <label>
        <span class="nebula-panel__name">Buffer scale <span class="nebula-panel__hint-inline">(разрешение буфера, FPS)</span></span>
        <span id="nebula-fbo-scale-val">0.50</span>
        <input type="range" id="nebula-fbo-scale" min="0.25" max="1" step="0.05">
      </label>
      <label>
        <span class="nebula-panel__name">Update rate <span class="nebula-panel__hint-inline">(как часто пересчитывать)</span></span>
        <span id="nebula-update-hz-val">8 Hz</span>
        <input type="range" id="nebula-update-hz" min="2" max="30" step="1">
      </label>
    </section>

    <div class="nebula-panel__actions">
      <button type="button" id="nebula-reset" class="nebula-panel__btn nebula-panel__btn--ghost">Сброс по умолчанию</button>
    </div>
    <p id="nebula-status" class="nebula-panel__status" hidden></p>
  </aside>

  <script src="assets/js/options.js?v=28"></script>
  <script src="assets/js/svg_parser.js?v=15"></script>
  <script src="assets/js/svg_points.js?v=15"></script>
  <script src="assets/js/make_a_texture.js?v=15"></script>
  <script src="assets/js/interface_handler.js?v=15"></script>
  <script src="assets/js/nebula_panel.js?v=27"></script>
  <script src="assets/js/main.js?v=27"></script>
</body>

</html>
